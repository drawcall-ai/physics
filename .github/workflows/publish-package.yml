name: Publish Packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CoACD WASM
        run: pnpm --filter @drawcall/physics build:coacd
      - name: Build, typecheck, and test
        run: pnpm check
      - name: Set release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          for package in physics physics-rapier physics-mujoco physics-usd; do
            npm --prefix "packages/$package" pkg set version="$version"
          done
          for package in physics-rapier physics-mujoco physics-usd; do
            npm --prefix "packages/$package" pkg set "peerDependencies.@drawcall/physics=^$version"
          done
      - name: Copy package documentation
        run: |
          cp README.md packages/physics/README.md
          for package in physics physics-rapier physics-mujoco physics-usd; do
            cp LICENSE "packages/$package/LICENSE"
          done
      - name: Pack packages
        run: pnpm --filter "./packages/*" -r pack --pack-destination "$RUNNER_TEMP/packages"
      - name: Publish core
        run: npm publish "$RUNNER_TEMP/packages/drawcall-physics-${RELEASE_TAG#v}.tgz" --access public --provenance --tag latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish Rapier adapter
        run: npm publish "$RUNNER_TEMP/packages/drawcall-physics-rapier-${RELEASE_TAG#v}.tgz" --access public --provenance --tag latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish MuJoCo adapter
        run: npm publish "$RUNNER_TEMP/packages/drawcall-physics-mujoco-${RELEASE_TAG#v}.tgz" --access public --provenance --tag latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish USD adapter
        run: npm publish "$RUNNER_TEMP/packages/drawcall-physics-usd-${RELEASE_TAG#v}.tgz" --access public --provenance --tag latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
