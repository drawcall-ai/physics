name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.2
      - uses: actions/cache@v4
        with:
          path: packages/physics-fem/.cache/gmsh
          key: ${{ runner.os }}-fem-gmsh-${{ hashFiles('packages/physics-fem/scripts/gmsh.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Build CoACD WASM
        run: pnpm --filter @drawcall/physics build:coacd
      - run: pnpm check
      - name: Verify package artifacts
        run: pnpm --filter "./packages/*" -r pack --pack-destination "$RUNNER_TEMP/packages"
